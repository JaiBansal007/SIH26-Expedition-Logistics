version: '3.8'

#==============================================================================
# Cargo Tracking - Testing/CI Infrastructure
#
# Minimal services for automated testing and CI/CD pipelines
# Optimized for fast startup and resource efficiency
#==============================================================================

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: cargo-postgres-test
    environment:
      POSTGRES_DB: cargo_tracking_test
      POSTGRES_USER: cargo_test
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargo_test"]
      interval: 5s
      timeout: 3s
      retries: 3

  redis-test:
    image: redis:7-alpine
    container_name: cargo-redis-test
    ports:
      - "6380:6379"
    command: redis-server --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  mailhog-test:
    image: mailhog/mailhog:latest
    container_name: cargo-mailhog-test
    ports:
      - "1026:1025"
      - "8026:8025"
