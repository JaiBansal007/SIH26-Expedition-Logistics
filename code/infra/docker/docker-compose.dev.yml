version: '3.8'

#==============================================================================
# Cargo Tracking - Development Infrastructure
#
# Services:
#   - PostgreSQL 15 (Database)
#   - Redis 7 (Caching)
#   - Kafka + Zookeeper (Message Queue)
#   - Adminer (Database GUI)
#   - Mailhog (Email Testing)
#   - Kafka UI (Kafka Management)
#
# Usage:
#   docker-compose -f code/infra/docker/docker-compose.dev.yml up -d
#   Or use: make infra-dev
#==============================================================================

services:
  #----------------------------------------------------------------------------
  # MySQL Database
  #----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: cargo-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cargo_tracking
      MYSQL_USER: cargo
      MYSQL_PASSWORD: cargo_dev_password_123
      MYSQL_ROOT_PASSWORD: root_password_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cargo-network

  #----------------------------------------------------------------------------
  # Redis Cache
  #----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cargo-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass cargo_redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cargo-network

  #----------------------------------------------------------------------------
  # Zookeeper (Required for Kafka)
  #----------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: cargo-zookeeper-dev
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: WARN
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 10"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cargo-network

  #----------------------------------------------------------------------------
  # Kafka Message Queue
  #----------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: cargo-kafka-dev
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - cargo-network

  #----------------------------------------------------------------------------
  # Adminer - Database Management UI
  #----------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: cargo-adminer-dev
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: dracula
    ports:
      - "8080:8080"
    networks:
      - cargo-network

  #----------------------------------------------------------------------------
  # Mailhog - Email Testing
  #----------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: cargo-mailhog-dev
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - cargo-network

  #----------------------------------------------------------------------------
  # Kafka UI - Kafka Management
  #----------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cargo-kafka-ui-dev
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: cargo-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8090:8080"
    networks:
      - cargo-network

#==============================================================================
# Volumes (Persistent Storage)
#==============================================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  kafka_data:
    driver: local

#==============================================================================
# Networks
#==============================================================================
networks:
  cargo-network:
    name: cargo-network-dev
    driver: bridge
